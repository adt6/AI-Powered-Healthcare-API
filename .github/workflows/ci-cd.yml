name: CI/CD Pipeline

# This workflow runs on every push and pull request
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Environment variables available to all jobs
env:
  PYTHON_VERSION: '3.11'
  DATABASE_URL: 'postgresql://test:test@localhost:5432/test_db'

jobs:
  # Job 1: Code Quality Checks
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: 📦 Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: 📥 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 "black==25.9.0" isort mypy
        
    - name: 🔍 Run code linting (flake8)
      run: |
        flake8 backend/ frontend/ .github/ --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=data,__pycache__,.git
        flake8 backend/ frontend/ .github/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=data,__pycache__,.git
        
    - name: 🎨 Check code formatting (black)
      run: |
        black --check --diff backend/ frontend/ --exclude='data|\.git|__pycache__'
        
    - name: 📋 Check import sorting (isort)
      run: |
        isort --check-only --diff backend/ frontend/
        
    - name: 🔍 Type checking (mypy)
      run: |
        mypy backend/ --ignore-missing-imports || true

  # Job 2: Run Tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    # Set up services (PostgreSQL for testing)
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: 📦 Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: 📥 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: 🧪 Run tests with pytest
      run: |
        cd backend/src && PYTHONPATH=. pytest tests/ -v --cov=api --cov-report=xml --cov-report=html --cov-fail-under=0
        
    - name: 📊 Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: backend/src/coverage.xml
        flags: unittests
        name: codecov-umbrella

  # Job 3: Security Scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: 📥 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit
        
    - name: 🔒 Run security scan (safety)
      run: |
        safety check --json --output safety-report.json || true
        
    - name: 🛡️ Run security linting (bandit)
      run: |
        bandit -r . -f json -o bandit-report.json || true

  # Job 4: Build Docker Image
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [code-quality, test, security]
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🐳 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: 🔐 Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: 🏗️ Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          adt6/ai-healthcare-api:latest
          adt6/ai-healthcare-api:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Job 5: Deploy (only on main branch)
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🚀 Deploy to production
      run: |
        echo "🚀 Deploying to production..."
        echo "This is where you would add your deployment commands"
        echo "Examples:"
        echo "- Deploy to AWS, Google Cloud, or Azure"
        echo "- Update Kubernetes cluster"
        echo "- Run database migrations"
        echo "- Restart services"
        
    - name: 📧 Notify deployment
      run: |
        echo "✅ Deployment completed successfully!"
        echo "🌐 Your API is now live at: https://your-api-domain.com"
